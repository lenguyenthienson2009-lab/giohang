<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng – Vince Caelos</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#0f1b2d;--mute:#5b6b82;--line:#e3e8f0;--acc:#0b5fff;--acc2:#0a3fb3;--ok:#0a8f5b;--bad:#d43b3b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#0f1b2d,#0b5fff);display:grid;place-items:center;font-size:30px}
.name{font-weight:650}
.meta{color:var(--mute);font-size:13px;margin-top:2px}
.price{font-weight:650;white-space:nowrap;text-align:right}
.row2{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qty button{width:34px;height:34px;border:0;background:#fff;font-size:18px;cursor:pointer}
.qty button:hover{background:var(--bg)}
.qty span{min-width:36px;display:grid;place-items:center;font-weight:600;font-size:14px}
.link{background:none;border:0;color:var(--bad);cursor:pointer;font-size:13px;padding:0}
.empty{text-align:center;padding:40px 10px;color:var(--mute)}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:650;font-size:15px;cursor:pointer;text-align:center;text-decoration:none}
.btn:hover{background:var(--acc2)}
.btn.sec{background:#fff;color:var(--acc);border:1px solid var(--acc);margin-top:8px}
.sum div{display:flex;justify-content:space-between;margin:9px 0;font-size:14px}
.sum .tot{font-size:18px;font-weight:700;border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.coupon{display:flex;gap:8px;margin:14px 0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.coupon button{padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer;font-weight:600}
.msg{font-size:12.5px;margin:-6px 0 8px}
.ok{color:var(--ok)}.err{color:var(--bad)}
h2{font-size:16px;margin:0 0 12px}
.form{display:grid;gap:10px;margin-top:14px}
.pay label{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:14px}
.pay input{width:auto}
.note{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.5}
.free{background:#eaf1ff;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.bar{height:6px;background:#d5e2ff;border-radius:9px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.sticky{display:none}
.chip{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.addbtn{display:block;box-sizing:border-box;width:100%;padding:13px 8px;border-radius:6px;background:#a8321f;color:#fff;font:600 14px/1.2 Roboto,system-ui,sans-serif;text-align:center;text-decoration:none;letter-spacing:.2px}
.addbtn:hover{background:#8a2616}
button.addbtn{border:0;cursor:pointer}
.ctl{display:flex;align-items:center;gap:10px;margin-top:8px;background:#fff;border:1px solid #e3e8f0;border-radius:8px;padding:6px 8px;font:13px Roboto,system-ui,sans-serif;color:#0f1b2d}
.stp{display:inline-flex;align-items:center;border:1px solid #e3e8f0;border-radius:8px;overflow:hidden}
.stp button{width:34px;height:32px;border:0;background:#fff;font-size:18px;cursor:pointer}
.stp button:hover{background:#f4f6fa}
.stp span{min-width:34px;text-align:center;font-weight:700}
.lk{background:none;border:0;padding:0;font:inherit;color:#d43b3b;cursor:pointer}
.lk.g{margin-left:auto;color:#0a8f5b;font-weight:600;text-decoration:none}
@media(max-width:820px){
 .grid{grid-template-columns:1fr}
 .item{grid-template-columns:60px 1fr}
 .thumb{width:60px;height:60px}
 .price{grid-column:2;text-align:left}
 .sticky{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;gap:12px;align-items:center;justify-content:space-between;z-index:5}
 .sticky b{font-size:17px}
 .sticky .btn{width:auto;padding:12px 22px}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>Giỏ hàng của bạn</h1>
 <p class="sub" id="count"></p>
 <div class="grid">
  <div>
   <div class="card" id="list"></div>
   <div class="card" id="more" style="margin-top:16px"><h2>Thêm sản phẩm</h2><div id="chips" style="display:flex;flex-wrap:wrap;gap:8px"></div></div>
   <div class="card" id="checkout" style="margin-top:16px">
    <h2>Thông tin nhận hàng</h2>
    <div class="form">
     <input id="fn" placeholder="Họ và tên *" autocomplete="name">
     <input id="ph" placeholder="Số điện thoại / Zalo *" inputmode="tel" autocomplete="tel">
     <input id="em" placeholder="Email (không bắt buộc)" inputmode="email" autocomplete="email">
     <textarea id="ad" rows="2" placeholder="Địa chỉ giao hàng *"></textarea>
     <textarea id="nt" rows="2" placeholder="Ghi chú (không bắt buộc)"></textarea>
    </div>
    <h2 style="margin-top:18px">Thanh toán</h2>
    <div class="pay">
     <label><input type="radio" name="pm" value="COD" checked> Thanh toán khi nhận hàng (COD)</label>
     <label><input type="radio" name="pm" value="Chuyển khoản"> Chuyển khoản ngân hàng</label>
    </div>
   </div>
  </div>
  <aside class="card sum" style="position:sticky;top:12px">
   <h2>Tóm tắt đơn hàng</h2>
   <div class="free" id="free"></div>
   <div class="coupon"><input id="cp" placeholder="Mã giảm giá"><button id="ap">Áp dụng</button></div>
   <div class="msg" id="cm"></div>
   <div><span>Tạm tính</span><span id="s1"></span></div>
   <div><span>Giảm giá</span><span id="s2"></span></div>
   <div><span>Phí vận chuyển</span><span id="s3"></span></div>
   <div class="tot"><span>Tổng cộng</span><span id="s4"></span></div>
   <button class="btn" id="send" style="margin-top:14px">Đặt hàng qua Zalo</button>
   <button class="btn sec" id="mail">Gửi đơn qua Email</button>
   <p class="note">Vince Caelos chỉ kinh doanh thiết bị bay dân dụng. Người mua tự chịu trách nhiệm tuân thủ quy định bay tại Việt Nam. Liên hệ: Zalo / ĐT 0918181818.</p>
  </aside>
 </div>
</div>
<div class="sticky"><div><small style="color:var(--mute)">Tổng cộng</small><br><b id="st"></b></div><a class="btn" href="#checkout">Thanh toán</a></div>

<script>
// Bảng giá (VND). Sửa price để đổi giá.
var CATALOG=[
 {id:"xi",name:"MINI XI",desc:"Camera cơ bản, gọn nhẹ, điều khiển đơn giản",price:7500000},
 {id:"x3",name:"MINI X3 PRO",desc:"Mini drone – camera nâng cao",price:13000000},
 {id:"x4",name:"MINI X4 PRO",desc:"Mini drone – camera nâng cao",price:50000000},
 {id:"xmax",name:"MINI XMAX",desc:"Mini drone – bản cao cấp",price:65000000},
 {id:"pro1",name:"PX1",desc:"Professional Camera Drone – quay phim chuyên nghiệp",price:51000000},
 {id:"pro2",name:"PX2",desc:"Professional Camera Drone – quay phim chuyên nghiệp",price:79000000},
 {id:"pro3",name:"PX3",desc:"Professional Camera Drone – quay phim chuyên nghiệp",price:99000000}
];
var COUPONS={"VINCE10":{t:"pct",v:10,label:"Giảm 10%"},"WELCOME":{t:"fix",v:200000,label:"Giảm 200.000đ"}};
var FREE_SHIP=5000000,SHIP=50000;
var cart=[],coupon=null;
try{var s=localStorage.getItem("vc_cart");if(s)cart=JSON.parse(s)}catch(e){}
var $=function(i){return document.getElementById(i)};
var vnd=function(n){return n.toLocaleString("vi-VN")+"đ"};
var find=function(id){return CATALOG.filter(function(p){return p.id===id})[0]};
function save(){try{localStorage.setItem("vc_cart",JSON.stringify(cart))}catch(e){}}
function calc(){
 var sub=0;cart.forEach(function(c){var p=find(c.id);if(p)sub+=p.price*c.q});
 var disc=0;if(coupon)disc=coupon.t==="pct"?Math.round(sub*coupon.v/100):Math.min(coupon.v,sub);
 var after=sub-disc,ship=!sub?0:(after>=FREE_SHIP?0:SHIP);
 return{sub:sub,disc:disc,ship:ship,tot:after+ship,after:after};
}
function render(){
 var n=cart.reduce(function(a,c){return a+c.q},0);
 $("count").textContent=n?n+" sản phẩm trong giỏ":"Chưa có sản phẩm nào";
 var h="";
 cart.forEach(function(c){var p=find(c.id);if(!p)return;
  h+='<div class="item"><div class="thumb">🚁</div><div><div class="name">'+p.name+'</div><div class="meta">'+p.desc+'</div>'+
  '<div class="row2"><div class="qty"><button data-m="'+p.id+'" aria-label="Giảm">−</button><span>'+c.q+'</span><button data-p="'+p.id+'" aria-label="Tăng">+</button></div>'+
  '<button class="link" data-d="'+p.id+'">Xóa</button></div></div><div class="price">'+vnd(p.price*c.q)+'</div></div>';
 });
 $("list").innerHTML=h||'<div class="empty">🛒<br><br>Giỏ hàng đang trống.<br><br><a href="https://sites.google.com/view/vince-caelos/sản-phẩm-đặc-thù" target="_top" class="btn" style="display:inline-block;width:auto;padding:11px 22px">Tiếp tục mua sắm</a></div>';
 var t=calc();
 $("s1").textContent=vnd(t.sub);
 $("s2").textContent=t.disc?"−"+vnd(t.disc):"0đ";
 $("s3").textContent=t.ship?vnd(t.ship):(t.sub?"Miễn phí":"0đ");
 $("s4").textContent=vnd(t.tot);$("st").textContent=vnd(t.tot);
 var left=FREE_SHIP-t.after;
 $("free").innerHTML=!t.sub?"Miễn phí vận chuyển cho đơn từ "+vnd(FREE_SHIP):(left>0?"Mua thêm <b>"+vnd(left)+"</b> để được miễn phí vận chuyển":"🎉 Đơn hàng được miễn phí vận chuyển")+'<div class="bar"><i style="width:'+Math.min(100,t.after/FREE_SHIP*100)+'%"></i></div>';
 save();
}
$("list").addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b)return;
 var id=b.dataset.p||b.dataset.m||b.dataset.d;
 cart.forEach(function(c){if(c.id===id){if(b.dataset.p)c.q=Math.min(99,c.q+1);if(b.dataset.m)c.q=Math.max(1,c.q-1)}});
 if(b.dataset.d)cart=cart.filter(function(c){return c.id!==id});
 render();
});
$("ap").onclick=function(){
 var code=$("cp").value.trim().toUpperCase(),m=$("cm");
 if(COUPONS[code]){coupon=COUPONS[code];m.className="msg ok";m.textContent="Đã áp dụng: "+coupon.label}
 else{coupon=null;m.className="msg err";m.textContent="Mã không hợp lệ"}
 render();
};
function order(){
 if(!cart.length){alert("Giỏ hàng đang trống");return null}
 var f=$("fn").value.trim(),p=$("ph").value.trim(),a=$("ad").value.trim();
 if(!f||!p||!a){alert("Vui lòng nhập họ tên, số điện thoại và địa chỉ.");$("checkout").scrollIntoView({behavior:"smooth"});return null}
 var t=calc(),pm=document.querySelector("input[name=pm]:checked").value;
 var L=["ĐƠN HÀNG – VINCE CAELOS","Khách: "+f,"SĐT: "+p];
 if($("em").value.trim())L.push("Email: "+$("em").value.trim());
 L.push("Địa chỉ: "+a,"");
 cart.forEach(function(c){var x=find(c.id);L.push("- "+x.name+" x"+c.q+": "+vnd(x.price*c.q))});
 if(t.disc)L.push("Giảm giá: −"+vnd(t.disc));
 L.push("Phí ship: "+(t.ship?vnd(t.ship):"Miễn phí"),"TỔNG: "+vnd(t.tot),"Thanh toán: "+pm);
 if($("nt").value.trim())L.push("Ghi chú: "+$("nt").value.trim());
 return L.join("\n");
}
$("send").onclick=function(){
 var o=order();if(!o)return;
 try{navigator.clipboard.writeText(o)}catch(e){}
 alert("Đã sao chép nội dung đơn hàng. Hãy dán vào khung chat Zalo để gửi cho shop.");
 window.open("https://zalo.me/0918181818","_blank");
};
$("mail").onclick=function(){
 var o=order();if(!o)return;
 window.open("mailto:toilavuquenamdinh@gmail.com?subject="+encodeURIComponent("Đơn hàng mới – Vince Caelos")+"&body="+encodeURIComponent(o),"_blank");
};
var CARTURL="https://sites.google.com/view/vince-caelos/gi%E1%BB%8F-h%C3%A0ng";
var BTN=new URLSearchParams(location.search).get("btn");
function addItem(id){
 var c=[];try{c=JSON.parse(localStorage.getItem("vc_cart")||"[]")}catch(e){}
 var h=c.filter(function(x){return x.id===id})[0];
 if(h)h.q=Math.min(99,h.q+1);else c.push({id:id,q:1});
 try{localStorage.setItem("vc_cart",JSON.stringify(c))}catch(e){}
 cart=c;
}
if(BTN){
 document.querySelector(".wrap").style.display="none";
 document.querySelector(".sticky").style.display="none";
 document.body.style.background="transparent";
 var box=document.createElement("div");
 box.innerHTML='<button class="addbtn" id="ba">THÊM VÀO GIỎ HÀNG</button><div class="ctl"><div class="stp"><button id="bm" aria-label="Bớt 1">−</button><span id="bn">0</span><button id="bp" aria-label="Thêm 1">+</button></div><button class="lk" id="bdel">Xóa</button><a class="lk g" href="'+CARTURL+'" target="_blank">Xem giỏ (<b id="bt">0</b>) ↗</a></div>';
 document.body.appendChild(box);
 var rd=function(){var c=[];try{c=JSON.parse(localStorage.getItem("vc_cart")||"[]")}catch(e){}return c};
 var wr=function(c){try{localStorage.setItem("vc_cart",JSON.stringify(c))}catch(e){}};
 var upd=function(){var q=0,t=0;rd().forEach(function(x){t+=x.q;if(x.id===BTN)q=x.q});$("bn").textContent=q;$("bt").textContent=t};
 var chg=function(d){var c=rd(),h=c.filter(function(x){return x.id===BTN})[0];
  if(h){h.q=Math.max(0,Math.min(99,h.q+d));if(!h.q)c=c.filter(function(x){return x.id!==BTN})}else if(d>0)c.push({id:BTN,q:d});
  wr(c);upd()};
 $("ba").onclick=function(){chg(1)};
 $("bp").onclick=function(){chg(1)};
 $("bm").onclick=function(){chg(-1)};
 $("bdel").onclick=function(){wr(rd().filter(function(x){return x.id!==BTN}));upd()};
 window.addEventListener("storage",upd);window.addEventListener("focus",upd);document.addEventListener("visibilitychange",upd);
 upd();
}else{
 CATALOG.forEach(function(p){var b=document.createElement("button");b.className="chip";b.textContent="+ "+p.name+" · "+vnd(p.price);b.onclick=function(){addItem(p.id);render()};$("chips").appendChild(b)});
 try{
  var add=new URLSearchParams(location.search).get("add");
  if(add&&find(add)){addItem(add);history.replaceState(null,"",location.pathname)}
 }catch(e){}
window.addEventListener("focus",reload);
document.addEventListener("visibilitychange",reload);
window.addEventListener("storage",reload);
function reload(){try{var s=localStorage.getItem("vc_cart");if(s){cart=JSON.parse(s);render()}}catch(e){}}
render();
}
</script>
</body>
</html>
